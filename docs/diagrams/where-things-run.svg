<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram of where every part of Mainworks runs: the coordinator host, its systemd units, Docker containers, Herdr, caretaker, compute machines, and outside services">
  <title>Where things run</title>
  <desc>The coordinator Linux host runs the loop, deploy watch, caretaker, control-plane server and Postgres (server on port 4310), Herdr with the Lead pane, and headless agents confined in worktrees. Test shards run on compute machines first, with the coordinator as fallback. Outside: GitHub, agent providers, npm and GHCR published by GitHub Actions, and your browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6672"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #d9dee3; stroke-width: 1.5; }
    .group { fill: none; stroke: #d9dee3; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .host { fill: #ffffff; stroke: #d9dee3; stroke-width: 2; }
    .loop { stroke: #b5480f; stroke-width: 2; }
    .hub { fill: #2f4a63; stroke: #2f4a63; }
    .compute { fill: #eef6f0; stroke: #2c7a4b; stroke-width: 1.8; }
    .ext { fill: #efe9fb; stroke: #6a4bb5; stroke-width: 1.5; }
    .t-title { font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #1b2129; }
    .t-sub { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 10.5px; fill: #5b6672; }
    .t-key { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9.5px; fill: #b5480f; }
    .t-label { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.08em; fill: #5b6672; }
    .t-note { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 9px; fill: #5b6672; }
    .t-arrow { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 8.5px; fill: #5b6672; }
    .t-hub { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; fill: #ffffff; }
    .s-hub { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 10.5px; fill: #d9dee3; }
    .k-hub { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 9.5px; fill: #ffffff; }
    .v-line { stroke: #5b6672; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="960" height="540" fill="#f5f6f7"/>

  <!-- The coordinator host -->
  <rect class="host" x="6" y="24" width="634" height="510" rx="14"/>
  <text class="t-label" x="20" y="46">COORDINATOR · YOUR HOST · LINUX</text>

  <!-- The loop unit -->
  <rect class="box loop" x="20" y="58" width="286" height="86" rx="10"/>
  <text class="t-title" x="32" y="77">graphyard-master-OWNER-NAME.service</text>
  <text class="t-sub" x="32" y="93">the loop — dispatch · merge writer · batch gate</text>
  <text class="t-key" x="32" y="113">journalctl --user</text>
  <text class="t-key" x="32" y="127">  -u graphyard-master-OWNER-NAME.service</text>

  <!-- The deploy unit -->
  <rect class="box" x="20" y="152" width="286" height="76" rx="10"/>
  <text class="t-title" x="32" y="171">graphyard-deploy-OWNER-NAME.service</text>
  <text class="t-sub" x="32" y="187">the deploy watch — build, restart, health, rollback</text>
  <text class="t-key" x="32" y="206">journalctl --user</text>
  <text class="t-key" x="32" y="220">  -u graphyard-deploy-OWNER-NAME.service</text>

  <!-- Herdr -->
  <rect class="box" x="20" y="236" width="286" height="54" rx="10"/>
  <text class="t-title" x="32" y="256">Herdr</text>
  <text class="t-sub" x="32" y="274">the Lead's pane and live sessions</text>

  <!-- Caretaker -->
  <rect class="box" x="20" y="298" width="286" height="58" rx="10"/>
  <text class="t-title" x="32" y="318">Caretaker</text>
  <text class="t-sub" x="32" y="334">runs every 30m — checks accounts, compute</text>
  <text class="t-sub" x="32" y="348">machines, stuck work and deploy lag</text>

  <!-- Headless agents -->
  <rect class="box" x="20" y="364" width="286" height="68" rx="10"/>
  <text class="t-title" x="32" y="384">Headless agent runs</text>
  <text class="t-sub" x="32" y="400">Builders · reviewers · producers</text>
  <text class="t-sub" x="32" y="416">bubblewrap + Landlock, each in its worktree</text>

  <!-- The files -->
  <rect class="box" x="20" y="440" width="286" height="72" rx="10"/>
  <text class="t-title" x="32" y="459">The files</text>
  <text class="t-sub" x="32" y="475">checkout .mainworks/ · worktrees</text>
  <text class="t-sub" x="32" y="491">~/.config/mainworks/&lt;install&gt;/ (0600, CLI)</text>

  <!-- Docker containers -->
  <rect class="group" x="344" y="58" width="288" height="304" rx="12"/>
  <text class="t-label" x="356" y="78">DOCKER</text>

  <rect class="box hub" x="356" y="88" width="264" height="78" rx="10"/>
  <text class="t-hub" x="368" y="109">graphyard-OWNER-NAME-server-1</text>
  <text class="s-hub" x="368" y="126">control plane + dashboard</text>
  <text class="s-hub" x="368" y="142">127.0.0.1:4310</text>
  <text class="k-hub" x="368" y="158">docker logs graphyard-OWNER-NAME-server-1</text>

  <rect class="box" x="356" y="174" width="264" height="68" rx="10"/>
  <text class="t-title" x="368" y="193">graphyard-OWNER-NAME-db-1</text>
  <text class="t-sub" x="368" y="210">Postgres 17, on the server's own network</text>
  <text class="t-key" x="368" y="230">docker logs graphyard-OWNER-NAME-db-1</text>

  <rect class="box" x="356" y="250" width="264" height="100" rx="10"/>
  <text class="t-title" x="368" y="270">Merge trials (fallback)</text>
  <text class="t-sub" x="368" y="287">graphyard-trial-… — runs local-only tests</text>
  <text class="t-sub" x="368" y="302">and fallback shards when compute machines</text>
  <text class="t-sub" x="368" y="317">are full, plus declared compose services</text>

  <text class="t-sub" x="356" y="384">One shared Git checkout under the units and</text>
  <text class="t-sub" x="356" y="399">containers, with every agent in its worktree.</text>

  <text class="t-note" x="20" y="526">OWNER-NAME is the repository's slug in every unit and container name an install owns.</text>

  <!-- Compute machines + Outside -->
  <text class="t-label" x="660" y="46">COMPUTE &amp; OUTSIDE</text>

  <rect class="box compute" x="660" y="58" width="294" height="94" rx="10"/>
  <text class="t-title" x="672" y="79">Compute machines (tests first)</text>
  <text class="t-sub" x="672" y="97">added hosts running rootless Docker via</text>
  <text class="t-sub" x="672" y="112">gy-compute + graphyard-host-shim;</text>
  <text class="t-sub" x="672" y="127">test shards run here first, coordinator fallback</text>

  <rect class="box ext" x="660" y="164" width="294" height="82" rx="10"/>
  <text class="t-title" x="672" y="185">GitHub</text>
  <text class="t-sub" x="672" y="203">every part fetches; only the merge</text>
  <text class="t-sub" x="672" y="218">writer pushes — deploy key or gh login</text>

  <rect class="box ext" x="660" y="258" width="294" height="72" rx="10"/>
  <text class="t-title" x="672" y="279">Agent providers</text>
  <text class="t-sub" x="672" y="297">Claude, Codex and the rest —</text>
  <text class="t-sub" x="672" y="312">the accounts' API calls</text>

  <rect class="box ext" x="660" y="342" width="294" height="80" rx="10"/>
  <text class="t-title" x="672" y="363">npm + GHCR</text>
  <text class="t-sub" x="672" y="381">packages published by GitHub</text>
  <text class="t-sub" x="672" y="396">Actions; the host holds no publish token</text>

  <rect class="box ext" x="660" y="434" width="294" height="78" rx="10"/>
  <text class="t-title" x="672" y="455">Your browser</text>
  <text class="t-sub" x="672" y="473">Home · Work · Lead · Settings</text>
  <text class="t-sub" x="672" y="488">localhost or the tailnet, port 4310</text>

  <!-- Arrows -->
  <path class="v-line" d="M 306 100 L 342 100"/>
  <text class="t-arrow" x="324" y="93" text-anchor="middle">its API</text>

  <path class="v-line" d="M 488 166 L 488 172"/>
  <text class="t-arrow" x="496" y="172">SQL</text>

  <path class="v-line" d="M 306 130 L 326 130 L 326 296 L 342 296"/>
  <text class="t-arrow" x="330" y="218" transform="rotate(-90 330 218)" text-anchor="middle">trials</text>

  <path class="v-line" d="M 620 296 L 646 296 L 646 104 L 656 104"/>
  <text class="t-arrow" x="641" y="200" transform="rotate(-90 641 200)" text-anchor="middle">test shards</text>

  <path class="v-line" d="M 22 92 L 13 92 L 13 264 L 19 264"/>
  <text class="t-arrow" x="16" y="178" transform="rotate(-90 16 178)" text-anchor="middle">Lead pane</text>

  <path class="v-line" d="M 306 398 L 640 398 L 640 294 L 656 294"/>
  <text class="t-arrow" x="470" y="393" text-anchor="middle">API calls</text>

  <path class="v-line" d="M 807 246 L 807 340"/>
  <text class="t-arrow" x="813" y="297">Actions publish</text>

  <path class="v-line" d="M 658 470 L 650 470 L 650 142 L 626 142"/>
  <text class="t-arrow" x="655" y="320" transform="rotate(-90 655 320)" text-anchor="middle">dashboard · :4310</text>
</svg>
